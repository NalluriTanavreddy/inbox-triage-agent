[project]
name = "inbox-triage-agent"
version = "0.1.0"
description = "An autonomous email classification and drafting assistant"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "anthropic",
    "typer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
