[project]
name = "inbox-triage-agent"
version = "0.1.0"
description = "An autonomous email classification and drafting assistant"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "anthropic",
    "typer",
    "python-dotenv",
    "pydantic>=2.13.5",
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
